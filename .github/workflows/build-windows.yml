name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "main.py"
      - "engine.py"
      - "requirements.txt"
      - "build_smoke_test.py"
      - "演示活动数据.xlsx"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify Excel and image-table features
        run: python build_smoke_test.py

      - name: Build one-file Windows application
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name WeComActivityNotifier
          --hidden-import xlrd
          --collect-all openpyxl
          --collect-all PIL
          --collect-all certifi
          main.py

      - name: Verify the packaged application starts
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist/WeComActivityNotifier.exe"
          if (-not (Test-Path $exe)) { throw "EXE was not created: $exe" }
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) {
            throw "The packaged application exited during startup (exit code $($process.ExitCode))."
          }
          Stop-Process -Id $process.Id -Force

      - name: Upload downloadable EXE
        uses: actions/upload-artifact@v4
        with:
          name: WeComActivityNotifier-Windows-x64
          path: dist/WeComActivityNotifier.exe
          if-no-files-found: error
          retention-days: 30
